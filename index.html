<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Snake</h1>
    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Best: <strong id="best">0</strong></span>
      <span id="effect-badge" class="effect-badge" hidden></span>
    </div>
    <div class="board-wrap" id="board-wrap">
      <canvas id="board" width="400" height="400"></canvas>
      <div id="pickup-toast" class="pickup-toast" hidden></div>
      <div id="overlay" class="overlay">
        <p id="overlay-text">Press Space or tap to start</p>
      </div>
      <div id="name-entry" class="overlay" hidden>
        <form id="name-form" class="name-form">
          <p>New high score: <strong id="pending-score">0</strong>!</p>
          <input id="name-input" type="text" placeholder="Your name" maxlength="12" autocomplete="off" />
          <div class="name-form-actions">
            <button type="submit">Save</button>
            <button type="button" id="skip-name">Skip</button>
          </div>
        </form>
      </div>
    </div>
    <p class="hint">Arrow keys / WASD to move &middot; Space to pause</p>
    <section class="leaderboard">
      <h2>High Scores</h2>
      <ol id="leaderboard-list"></ol>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
